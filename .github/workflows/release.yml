name: Release

# Two entry points, one pipeline:
#   - push of a v* tag (the classic path)
#   - workflow_dispatch from the default branch: resolves the version from
#     Cargo.toml, mints the tag itself, and continues — releases can be cut
#     from the Actions UI (or an API call) with no local terminal.
# The dispatch-minted tag is pushed with GITHUB_TOKEN, whose ref pushes
# deliberately trigger no follow-on workflow runs (GitHub suppresses them to
# prevent recursion) — which is exactly right here: THIS run carries the
# release end-to-end and never depends on the tag-push event.
#
# The image is built per-arch on NATIVE runners in parallel (amd64 on
# ubuntu-latest, arm64 on ubuntu-24.04-arm — free for public repos), pushed
# by digest, then stitched into one multi-arch manifest. QEMU emulation made
# the arm64 Rust compile the whole run's critical path (~30 min); native
# builds bring the release to a few minutes. Signing, provenance attestation,
# and the SBOM all target the final manifest digest.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# Least privilege by default; each job opts into exactly what it needs.
permissions:
  contents: read

# One release at a time, never cancelled mid-flight: a cancelled run could
# leave a signed manifest without its GitHub release, or a minted tag without
# artifacts. A single global group (not per-ref) also serializes a dispatch
# racing a tag push. Note GitHub keeps at most ONE pending run per group —
# a third trigger replaces the queued one (re-run it manually if that ever
# happens); it never cancels the run in progress.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    name: resolve version (mint tag on dispatch)
    runs-on: ubuntu-latest
    permissions:
      contents: write # mints the v* tag on the dispatch path
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      minor: ${{ steps.resolve.outputs.minor }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0 # zizmor: ignore[artipacked] credentials kept deliberately: this job pushes the minted v* tag
      - id: resolve

        name: Resolve version from Cargo.toml; mint the tag on dispatch
        # Context values reach the script via env, never inline `${{ }}` in
        # the run block (template-injection hygiene).
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "::error::dispatch releases run from the default branch only (got $GITHUB_REF_NAME)"
              exit 1
            fi
            if git ls-remote --exit-code origin "refs/tags/v$version" >/dev/null 2>&1; then
              echo "::error::v$version already exists — bump Cargo.toml (and promote the CHANGELOG) first"
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$version" -m "nim-proxy $version" "$GITHUB_SHA"
            git push origin "v$version"
          else
            # The binary reports CARGO_PKG_VERSION; the image is labeled with
            # the git tag. Refuse to ship an image where the two disagree.
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              grep '^version = ' Cargo.toml
              exit 1
            fi
          fi
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.arch }} (native)
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push per-arch image by digest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Labels only — tags are applied by the merge job on the manifest.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          # Push by digest only; the merge job stitches the tagged manifest.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      # The documented multi-runner pattern: matrix job outputs clobber each
      # other, so each leg exports its digest as an artifact file instead.
      - name: Export digest
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="$BUILD_DIGEST"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
      # Extract the exact static binary we just shipped — natively on this
      # runner: create (not run) a container and copy /nim-proxy out.
      - name: Extract release binary
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cid=$(docker create --platform "$RELEASE_PLATFORM" "${IMAGE}@${BUILD_DIGEST}")
          docker cp "$cid:/nim-proxy" "nim-proxy-${RELEASE_ARCH}"
          docker rm "$cid" >/dev/null
          tar -czf "nim-proxy-${RELEASE_VERSION}-linux-${RELEASE_ARCH}.tar.gz" "nim-proxy-${RELEASE_ARCH}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.arch }}
          path: nim-proxy-*.tar.gz
          if-no-files-found: error

  merge:
    name: manifest → sign → attest → SBOM
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the tagged multi-arch manifest
      id-token: write # keyless cosign + provenance via OIDC
      attestations: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - id: manifest
        name: Stitch the multi-arch manifest and tag it
        working-directory: ${{ runner.temp }}/digests
        env:
          RELEASE_MINOR: ${{ needs.prepare.outputs.minor }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # Each downloaded artifact file is named by its image digest hex.
          refs=()
          for d in *; do refs+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create \
            -t "${IMAGE}:${RELEASE_VERSION}" \
            -t "${IMAGE}:${RELEASE_MINOR}" \
            -t "${IMAGE}:latest" \
            "${refs[@]}"
          digest=$(docker buildx imagetools inspect \
            "${IMAGE}:${RELEASE_VERSION}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin the CLI independently: installer majors may change their
          # default Cosign major and therefore its command-line contract.
          cosign-release: v3.1.2
      - name: Sign image (keyless)
        env:
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${MANIFEST_DIGEST}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: nim-proxy-sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: nim-proxy-sbom.spdx.json
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [prepare, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # keyless cosign sign-blob over the downloadable assets
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{binary-*,sbom}"
          merge-multiple: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      # The container manifest is already signed in the merge job; this signs
      # the *downloadable* assets (the per-arch tarballs and the SBOM) so a
      # binary pulled from the Releases page is verifiable too, not just the
      # image. Keyless: the OIDC identity is this workflow, verified below.
      # Each blob gets one Sigstore bundle containing its signature,
      # certificate, and transparency-log proof.
      - name: Sign release assets (keyless)
        run: |
          set -euo pipefail
          for f in nim-proxy-*.tar.gz nim-proxy-sbom.spdx.json; do
            cosign sign-blob --yes \
              --bundle "$f.sigstore.json" \
              "$f"
          done
      - name: Publish release
        # GitHub-hosted runners include gh. Keeping publication in a script
        # removes a third-party action while preserving the release contract.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            printf '%s\n\n' 'Container image (multi-arch, signed, with SBOM + provenance):'
            printf '%s\n' '```sh'
            printf 'docker pull ghcr.io/%s:%s\n' "$REPOSITORY" "$RELEASE_VERSION"
            printf '%s\n\n' '```'
            printf '%s\n\n' 'Verify the image signature:'
            printf '%s\n' '```sh'
            printf 'cosign verify ghcr.io/%s:%s \\\n' "$REPOSITORY" "$RELEASE_VERSION"
            printf "  --certificate-identity-regexp 'https://github.com/%s/.github/workflows/release.yml@.*' \\\\\n" "$REPOSITORY"
            printf '%s\n' '  --certificate-oidc-issuer https://token.actions.githubusercontent.com'
            printf '%s\n\n' '```'
            printf '%s\n\n' 'Verify a downloaded asset (tarball or SBOM) against its Sigstore bundle:'
            printf '%s\n' '```sh'
            printf 'cosign verify-blob nim-proxy-%s-linux-amd64.tar.gz \\\n' "$RELEASE_VERSION"
            printf '  --bundle nim-proxy-%s-linux-amd64.tar.gz.sigstore.json \\\n' "$RELEASE_VERSION"
            printf "  --certificate-identity-regexp 'https://github.com/%s/.github/workflows/release.yml@.*' \\\\\n" "$REPOSITORY"
            printf '%s\n' '  --certificate-oidc-issuer https://token.actions.githubusercontent.com'
            printf '%s\n' '```'
          } > release-notes.md

          # Explicit tag: dispatch runs start from a branch ref. --notes is a
          # preamble when combined with --generate-notes.
          gh release create "$RELEASE_TAG" \
            nim-proxy-*.tar.gz \
            nim-proxy-*.tar.gz.sigstore.json \
            nim-proxy-sbom.spdx.json \
            nim-proxy-sbom.spdx.json.sigstore.json \
            --repo "$REPOSITORY" \
            --generate-notes \
            --notes "$(<release-notes.md)"
